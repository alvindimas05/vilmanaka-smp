server {
    # Replace with your actual domain name or VPS IP address
    server_name vilmanaka.ddns.net; 

    # Point this exactly to your Astro build output directory
    root /var/www/vilmanaka-smp/dist;
    index index.html;

    # Gzip compression (Optional but highly recommended for performance)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # Astro generates individual HTML folders/files (e.g., /map/index.html)
        # This tells Nginx to look for the file, then the directory, then fallback
        try_files $uri $uri/ /index.html =404;
    }

    # Optional: Heavily cache static assets (Vite hashes these file names so it's safe)
    location ~* \.(?:css|js|woff2?|svg|gif|jpg|jpeg|png|webp|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    location = /bluemap {
        return 301 /bluemap/;
    }

    location ^~ /bluemap/ {
        proxy_pass http://185.128.227.73:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets support (Crucial for BlueMap's live player tracking)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Prevent iframe embedding issues
        proxy_hide_header 'X-Frame-Options';
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vilmanaka.ddns.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vilmanaka.ddns.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = vilmanaka.ddns.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name vilmanaka.ddns.net;
    return 404; # managed by Certbot
}